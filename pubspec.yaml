name: talentlink_app
description: TalentLink - GlobalTech's mobile learning hub and event check-in.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management + architecture
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # Device features
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  # REST
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
